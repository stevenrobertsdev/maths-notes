name: Build and publish notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile mathematics1 notes
        uses: xu-cheng/latex-action@v3
        with:
          root_file: mathematics1.tex
          working_directory: mathematics1

      - name: Collect PDFs
        run: |
          mkdir -p _site
          cp mathematics1/mathematics1.pdf _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4